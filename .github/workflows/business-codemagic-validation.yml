name: Business Codemagic YAML and chat command validation
on:
  pull_request:
    paths:
      - 'codemagic.yaml'
      - 'business-mobile/scripts/codemagic-*.cjs'
      - '.github/workflows/business-codemagic-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: business-mobile/package-lock.json
      - name: Verify native scripts
        run: |
          node --check business-mobile/scripts/codemagic-build-version.cjs
          node --check business-mobile/scripts/codemagic-android-signing.cjs
      - name: Validate one-repo Codemagic workflows and safety gates
        run: |
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          import pathlib, yaml
          workflows=yaml.safe_load(pathlib.Path('codemagic.yaml').read_text())['workflows']
          markers={
            'caliskan-b2b-ios': '.github/release-requests/b2b-ios-testflight.txt',
            'caliskan-b2b-testflight': '.github/release-requests/b2b-ios-testflight-only.txt',
            'caliskan-business-ios-testflight': '.github/release-requests/business-codemagic-testflight.txt',
            'caliskan-business-android-apk': '.github/release-requests/business-codemagic-apk.txt',
            'caliskan-business-android-aab': '.github/release-requests/business-codemagic-aab.txt',
          }
          for name, marker in markers.items():
            item=workflows[name]
            assert item['triggering']['events']==['push'], name
            assert item['triggering']['branch_patterns'][0]['pattern']=='main', name
            assert item['when']['changeset']['includes']==[marker], name
            assert marker in item['scripts'][0]['script'], name
            assert 'git show --format= --name-only HEAD' in item['scripts'][0]['script'], name
          for name in ('caliskan-business-ios-testflight','caliskan-business-android-apk','caliskan-business-android-aab'):
            item=workflows[name]
            assert item['environment']['vars']['EXPO_PUBLIC_API_URL']=='https://admin.ecalisgan.com'
            assert 'business-mobile' in str(item['scripts'])
          ios=workflows['caliskan-business-ios-testflight']
          assert ios['environment']['ios_signing']['bundle_identifier']=='com.caliskangroup.business'
          assert ios['publishing']['app_store_connect']['submit_to_testflight'] is True
          assert ios['publishing']['app_store_connect']['submit_to_app_store'] is False
          for name in ('caliskan-business-android-apk','caliskan-business-android-aab'):
            assert workflows[name]['environment']['android_signing']==['caliskan_business_android_release']
          print('Shared repo / 5 workflows / isolated release markers validated')
          PY
      - name: Check Android and iOS build number generation
        working-directory: business-mobile
        run: |
          set -e
          cp app.json /tmp/business-original-app.json
          BUILD_NUMBER=42 node scripts/codemagic-build-version.cjs ios
          node -e "const e=require('./app.json').expo; if(!/^\\d{9}$/.test(e.ios.buildNumber)) process.exit(1)"
          cp /tmp/business-original-app.json app.json
          BUILD_NUMBER=42 node scripts/codemagic-build-version.cjs android
          node -e "const e=require('./app.json').expo; if(e.android.versionCode<100000000) process.exit(1)"
          cp /tmp/business-original-app.json app.json
      - name: Verify Business TypeScript
        working-directory: business-mobile
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit --project tsconfig.json
