name: Çalışkan Dükkân - B2B katalog senkronizasyon kontrolleri
on:
  push:
    branches: [main]
    paths:
      - 'server/dukkan.ts'
      - 'server/dukkan-b2b-sync.ts'
      - 'server/dukkan-b2b-sync.test.ts'
      - 'server/dukkan-b2b-sync.integration.test.ts'
      - 'server/dukkan-b2b-autoimport.integration.test.ts'
      - 'client/src/pages/dukkan-product-edit.tsx'
      - 'client/src/App.tsx'
      - 'client/src/pages/dukkan.tsx'
      - '.github/workflows/dukkan-b2b-catalog-sync-check.yml'
  pull_request:
    paths:
      - 'server/dukkan.ts'
      - 'server/dukkan-b2b-sync.ts'
      - 'server/dukkan-b2b-sync.test.ts'
      - 'server/dukkan-b2b-sync.integration.test.ts'
      - 'server/dukkan-b2b-autoimport.integration.test.ts'
      - 'client/src/pages/dukkan-product-edit.tsx'
      - 'client/src/App.tsx'
      - 'client/src/pages/dukkan.tsx'
      - '.github/workflows/dukkan-b2b-catalog-sync-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsx --test server/dukkan-b2b-sync.test.ts server/dukkan-b2b-sync.integration.test.ts server/dukkan-b2b-autoimport.integration.test.ts
      - run: npm run check
      - run: npm run build
