name: Çalışkan Dükkân - B2B katalog senkronizasyon kontrolleri
on:
  push:
    branches: [main]
    paths:
      - 'server/dukkan.ts'
      - 'server/dukkan-cari-statement-parser.ts'
      - 'server/dukkan-cari-statement-parser.test.ts'
      - 'server/dukkan-cari-import.ts'
      - 'server/dukkan-cari-import.integration.test.ts'
      - 'client/src/pages/dukkan-cari-edit.tsx'
      - 'client/src/components/dukkan-cari-statement-import.tsx'
      - 'client/src/components/dukkan-ai-document-import.tsx'
      - 'client/src/components/dukkan-cari-actions-drawer.tsx'
      - 'server/dukkan-stock-ledger.ts'
      - 'server/dukkan-stock-ledger.integration.test.ts'
      - 'server/dukkan-stock-adjustments.ts'
      - 'server/dukkan-stock-adjustments.integration.test.ts'
      - 'client/src/components/dukkan-stock-workspace.tsx'
      - 'server/dukkan-b2b-sync.ts'
      - 'server/dukkan-b2b-sync.test.ts'
      - 'server/dukkan-b2b-sync.integration.test.ts'
      - 'server/dukkan-b2b-autoimport.integration.test.ts'
      - 'client/src/pages/dukkan-product-edit.tsx'
      - 'client/src/App.tsx'
      - 'client/src/pages/dukkan.tsx'
      - 'client/src/components/dukkan-invoice-form-settings.tsx'
      - 'client/src/lib/dukkan-invoice-pdf.ts'
      - 'client/src/lib/dukkan-sales-form-classic.ts'
      - 'client/src/components/dukkan-classic-sales-preview.tsx'
      - 'shared/dukkan-invoice-forms.ts'
      - 'shared/dukkan-invoice-forms.test.ts'
      - 'client/src/components/dukkan-product-toolbar.tsx'
      - 'client/src/lib/dukkan-product-toolbar.ts'
      - 'client/src/lib/dukkan-product-toolbar.test.ts'
      - '.github/workflows/dukkan-b2b-catalog-sync-check.yml'
  pull_request:
    paths:
      - 'server/dukkan.ts'
      - 'server/dukkan-cari-statement-parser.ts'
      - 'server/dukkan-cari-statement-parser.test.ts'
      - 'server/dukkan-cari-import.ts'
      - 'server/dukkan-cari-import.integration.test.ts'
      - 'client/src/pages/dukkan-cari-edit.tsx'
      - 'client/src/components/dukkan-cari-statement-import.tsx'
      - 'client/src/components/dukkan-ai-document-import.tsx'
      - 'client/src/components/dukkan-cari-actions-drawer.tsx'
      - 'server/dukkan-stock-ledger.ts'
      - 'server/dukkan-stock-ledger.integration.test.ts'
      - 'server/dukkan-stock-adjustments.ts'
      - 'server/dukkan-stock-adjustments.integration.test.ts'
      - 'client/src/components/dukkan-stock-workspace.tsx'
      - 'server/dukkan-b2b-sync.ts'
      - 'server/dukkan-b2b-sync.test.ts'
      - 'server/dukkan-b2b-sync.integration.test.ts'
      - 'server/dukkan-b2b-autoimport.integration.test.ts'
      - 'client/src/pages/dukkan-product-edit.tsx'
      - 'client/src/App.tsx'
      - 'client/src/pages/dukkan.tsx'
      - 'client/src/components/dukkan-invoice-form-settings.tsx'
      - 'client/src/lib/dukkan-invoice-pdf.ts'
      - 'client/src/lib/dukkan-sales-form-classic.ts'
      - 'client/src/components/dukkan-classic-sales-preview.tsx'
      - 'shared/dukkan-invoice-forms.ts'
      - 'shared/dukkan-invoice-forms.test.ts'
      - 'client/src/components/dukkan-product-toolbar.tsx'
      - 'client/src/lib/dukkan-product-toolbar.ts'
      - 'client/src/lib/dukkan-product-toolbar.test.ts'
      - '.github/workflows/dukkan-b2b-catalog-sync-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsx --test server/dukkan-b2b-sync.test.ts server/dukkan-b2b-sync.integration.test.ts server/dukkan-b2b-autoimport.integration.test.ts client/src/lib/dukkan-product-toolbar.test.ts server/dukkan-stock-ledger.integration.test.ts server/dukkan-stock-adjustments.integration.test.ts shared/dukkan-invoice-forms.test.ts server/dukkan-cari-statement-parser.test.ts server/dukkan-cari-import.integration.test.ts
      - run: npm run check
      - run: npm run build
