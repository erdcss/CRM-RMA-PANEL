name: Çalışkan Dükkan - iOS TestFlight (ortak Expo hesabı)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: caliskan-dukkan-ios-testflight
  cancel-in-progress: false
jobs:
  validate:
    name: Check reused Expo access and native accounting build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dukkan-mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require existing Expo authorization
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is missing; existing Expo project credentials cannot be used."
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Expo account
        run: eas whoami
      - name: Dependencies
        run: npm install --no-audit --no-fund
      - name: Windows / mobile accounting schema verification
        run: node --test check-schema.cjs
      - name: Mobile TypeScript and iOS bundle
        run: |
          npm run check
          npx expo export --platform ios --output-dir dist-ios-check
      - name: Verify isolated Apple / Expo application identifiers (no Apple API calls)
        run: |
          node -e 'const app=require("./app.json").expo; const eas=require("./eas.json"); const s=eas.submit.testflight.ios; if(app.ios.bundleIdentifier!=="com.caliskan.dukkan" || app.extra?.eas?.projectId!=="21b3de7c-763f-4c25-87aa-66e818498d6e" || s.appleTeamId!=="U3WGSDJCT2" || s.ascAppId!=="6826848065"){console.error("Dükkan App Store Connect / Expo project identity mismatch");process.exit(1)}; console.log("Verified dedicated Dükkan iOS identity")'

  release:
    name: Build dedicated Çalışkan Dükkan iOS IPA and submit to TestFlight
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: dukkan-mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm install --no-audit --no-fund
      - name: Verify linked Dükkan Expo project
        run: eas project:info --non-interactive
      - name: iOS TestFlight build (dedicated bundle)
        run: eas build --platform ios --profile testflight --freeze-credentials --non-interactive --wait
      - name: Submit IPA to App Store Connect TestFlight
        run: eas submit --platform ios --profile testflight --latest --non-interactive --wait
      - name: Release receipt
        run: |
          echo 'iOS EAS build and App Store Connect submission completed. Check TestFlight processing in App Store Connect.' >> "$GITHUB_STEP_SUMMARY"
