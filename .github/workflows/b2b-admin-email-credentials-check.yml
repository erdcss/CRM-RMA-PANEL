name: B2B Admin Email and Temporary Password Security
on:
  pull_request:
    paths:
      - 'server/routes.ts'
      - 'server/b2b-customer-credentials.ts'
      - 'server/b2b-customer-credentials.test.ts'
      - 'client/src/pages/admin-b2b-customer-detail.tsx'
      - '.github/workflows/b2b-admin-email-credentials-check.yml'
  push:
    branches: [main]
    paths:
      - 'server/routes.ts'
      - 'server/b2b-customer-credentials.ts'
      - 'server/b2b-customer-credentials.test.ts'
      - 'client/src/pages/admin-b2b-customer-detail.tsx'
      - '.github/workflows/b2b-admin-email-credentials-check.yml'
permissions:
  contents: read
jobs:
  verify:
    name: Customer Email Security, TypeScript and Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsx --test server/b2b-customer-credentials.test.ts
      - run: npm run check
      - run: npm run build
