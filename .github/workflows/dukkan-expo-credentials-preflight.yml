name: Çalışkan Dükkan Expo EAS erişim kontrolü
on:
  pull_request:
    paths:
      - ".github/workflows/dukkan-expo-credentials-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access:
    name: Mevcut Expo kimlik bilgileriyle giriş
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dukkan-mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure shared Expo token exists without displaying it
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Shared EXPO_TOKEN is not present in this GitHub Actions run"
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install app dependencies for EAS config evaluation
        run: npm install --no-audit --no-fund
      - name: Confirm Expo EAS identity
        run: eas whoami
      - name: Initialize dedicated Dükkan EAS project on authenticated Expo owner
        run: |
          eas init --account erdcls --non-interactive
          eas project:info --non-interactive
