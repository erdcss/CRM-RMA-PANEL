name: Çalışkan Dükkan Expo EAS erişim kontrolü
on:
  pull_request:
    paths:
      - ".github/workflows/dukkan-expo-credentials-preflight.yml"
      - "dukkan-mobile/app.json"
      - "dukkan-mobile/eas.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access:
    name: Mevcut Expo kimlik bilgileriyle giriş
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dukkan-mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure shared Expo token exists without displaying it
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Shared EXPO_TOKEN is not present in this GitHub Actions run"
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install app dependencies for EAS config evaluation
        run: npm install --no-audit --no-fund
      - name: Confirm Expo EAS identity
        run: eas whoami
      - name: Confirm dedicated Dükkan EAS project is linked
        run: |
          eas project:info --non-interactive
      - name: Read-only recent iOS EAS build status
        run: |
          eas build:list --platform ios --limit 3 --json --non-interactive > /tmp/dukkan-ios-builds.json
          node - <<'NODE'
          const fs=require('fs');
          const builds=JSON.parse(fs.readFileSync('/tmp/dukkan-ios-builds.json','utf8'));
          for(const item of builds){
            console.log('Dukkan EAS iOS:', item.status, 'version:', item.appVersion||'?', 'build:', item.appBuildVersion||'?');
          }
          NODE
      - name: Read-only App Store Connect TestFlight status
        run: |
          eas submit:status --platform ios --profile testflight --json --non-interactive > /tmp/dukkan-testflight-status.json
          node - <<'NODE'
          const fs=require('fs'), result=JSON.parse(fs.readFileSync('/tmp/dukkan-testflight-status.json','utf8'));
          console.log('App Store Connect status available for Dukkan:',!!result);
          NODE
