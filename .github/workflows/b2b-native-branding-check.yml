name: B2B Native Branding Check
on:
  push:
    paths:
      - 'mobile/scripts/sync-mobile-branding.cjs'
      - 'mobile/scripts/android-adaptive-icon.cjs'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - 'mobile/scripts/check-brand-sync.cjs'
      - 'mobile/scripts/eas-preinstall.cjs'
      - 'mobile/scripts/eas-branding-preinstall.cjs'
      - 'mobile/scripts/b2b-custom-notification-sound.cjs'
      - 'mobile/scripts/b2b-custom-notification-sound.test.cjs'
      - 'mobile/eas.json'
      - 'mobile/app.json'
      - '.github/workflows/b2b-native-branding-check.yml'
  workflow_dispatch:
jobs:
  verify-brand-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile dependencies
        run: npm ci --prefix mobile --ignore-scripts
      - name: Validate native branding scripts
        run: |
          node --check mobile/scripts/sync-mobile-branding.cjs
          node --check mobile/scripts/android-adaptive-icon.cjs
          node --check mobile/scripts/check-brand-sync.cjs
          node --check mobile/scripts/eas-preinstall.cjs
          node --check mobile/scripts/eas-branding-preinstall.cjs
          node --check mobile/scripts/b2b-custom-notification-sound.cjs
          node --check mobile/scripts/b2b-custom-notification-sound.test.cjs
      - name: Test iOS/Android notification sound packaging
        run: node --test mobile/scripts/b2b-custom-notification-sound.test.cjs
      - name: Validate admin-only brand sync
        run: node mobile/scripts/check-brand-sync.cjs
