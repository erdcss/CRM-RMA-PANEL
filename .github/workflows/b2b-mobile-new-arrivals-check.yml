name: B2B Mobil Yeni Gelen Ürünler - web parity QA

on:
  push:
    branches: [main]
    paths:
      - 'mobile/app/(tabs)/index.tsx'
      - 'mobile/lib/home-arrivals.ts'
      - 'mobile/lib/home-arrivals.test.ts'
      - 'mobile/lib/api.ts'
      - 'mobile/lib/marketplace-products.ts'
      - '.github/workflows/b2b-mobile-new-arrivals-check.yml'
  pull_request:
    paths:
      - 'mobile/app/(tabs)/index.tsx'
      - 'mobile/lib/home-arrivals.ts'
      - 'mobile/lib/home-arrivals.test.ts'
      - 'mobile/lib/api.ts'
      - 'mobile/lib/marketplace-products.ts'
      - '.github/workflows/b2b-mobile-new-arrivals-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 24h catalog and native TypeScript checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Install shared test runner
        run: npm ci --ignore-scripts
      - name: Check mobile 24h sorting and approved supplier timestamp
        run: npx tsx --test mobile/lib/home-arrivals.test.ts
      - name: Install native app dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts
      - name: Typecheck Expo native app
        working-directory: mobile
        run: npm run typecheck
