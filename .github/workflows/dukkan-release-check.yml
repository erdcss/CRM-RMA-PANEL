name: Caliskan Dukkan build checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/dukkan.ts"
      - "server/routes.ts"
      - "client/src/pages/dukkan.tsx"
      - "client/src/App.tsx"
      - "dukkan-desktop/**"
      - "dukkan-mobile/**"
      - ".github/workflows/dukkan-release-check.yml"
  push:
    paths:
      - "dukkan-desktop/**"
      - "dukkan-mobile/**"
      - ".github/workflows/dukkan-release-check.yml"
jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dukkan-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dukkan-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Caliskan-Dukkan-Windows-Setup
          path: dukkan-desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
