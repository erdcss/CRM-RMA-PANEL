name: Business mobile stability checks
on:
  pull_request:
    paths:
      - 'business-mobile/**'
      - '.github/workflows/business-mobile-stability-check.yml'
  push:
    branches: [main]
    paths:
      - 'business-mobile/**'
      - '.github/workflows/business-mobile-stability-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Business mobile typecheck and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: business-mobile/package-lock.json
      - name: Install native dependencies
        working-directory: business-mobile
        run: npm ci --ignore-scripts
      - name: Typecheck
        working-directory: business-mobile
        run: npx tsc --noEmit --project tsconfig.json
      - name: Export iOS JavaScript bundle
        working-directory: business-mobile
        run: npx expo export --platform ios
      - name: Install Railway-only web dependencies
        working-directory: business-mobile
        run: npm install --no-save --package-lock=false --no-audit --no-fund react-dom@19.2.3 react-native-web@0.21.4
      - name: Export web bundle
        working-directory: business-mobile
        run: npm run build
