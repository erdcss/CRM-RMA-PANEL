name: B2B AI PDF Catalog Import
on:
  push:
    paths:
      - 'client/src/lib/pdf-catalog-pages.ts'
      - 'client/src/pages/admin-product-ai-import.tsx'
      - 'server/product-ai.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/b2b-ai-pdf-catalog-import.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Server and client TypeScript
        run: npm run check
      - name: Production Vite and Express bundle
        run: npm run build
      - name: Verify PDF image/source rules
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const ui=fs.readFileSync('client/src/pages/admin-product-ai-import.tsx','utf8');
          const pdf=fs.readFileSync('client/src/lib/pdf-catalog-pages.ts','utf8');
          const api=fs.readFileSync('server/product-ai.ts','utf8');
          if(!ui.includes('for await (const page of renderCataloguePdf(file))') ||
             !ui.includes('page.crop') || !ui.includes('allowMissingImages: false'))
            throw Error('Per-page PDF import, source-image extraction or missing-photo gate absent');
          if(!pdf.includes("import('pdfjs-dist')")||!pdf.includes('cropProductImage'))
            throw Error('PDF rendering or image crop missing');
          if(!api.includes('sourceImageBox')||!api.includes('expectedCount'))
            throw Error('Source photo box or completeness count missing from AI schema');
          console.log('PDF source image linkage and completeness checks passed');
          NODE
