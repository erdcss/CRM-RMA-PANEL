name: Çalışkan B2B - Android APK telefon testi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/release-requests/b2b-android-apk.txt'

permissions:
  contents: read

concurrency:
  group: caliskan-b2b-android-apk
  cancel-in-progress: false

jobs:
  android-apk:
    name: Güncel B2B Android APK üret ve indirilebilir arşiv hazırla
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: "1"
      B2B_ANDROID_BUILD: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Expo token doğrula
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=Expo token eksik::GitHub EXPO_TOKEN secret tanımlanmalı"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Bağımlılıklar ve sürüm doğrulaması
        shell: bash
        run: |
          npm ci
          node - <<'NODE'
          const app=require('./app.json').expo;
          const eas=require('./eas.json');
          if(app.android?.package!=='com.caliskangroup.rma')
            throw Error('Yanlış Android paket kimliği: '+app.android?.package);
          if(app.version!=='1.3.12')
            throw Error('Beklenmeyen sürüm: '+app.version);
          if(eas.build['android-apk']?.android?.buildType!=='apk'||
             eas.build['android-apk']?.distribution!=='internal'||
             eas.build['android-apk']?.env?.B2B_ANDROID_BUILD!=='1')
            throw Error('Android APK profili veya bildirim sesi yapılandırması geçersiz');
          console.log('B2B Android APK',app.version,app.android.package);
          NODE
          node scripts/create-scan-beep.cjs
          node scripts/prepare-native-release.cjs
          npm run sync:branding
          B2B_ANDROID_BUILD=0 node --test scripts/b2b-custom-notification-sound.test.cjs
          npm run typecheck
          eas whoami
      - name: Android yerel kaynaklarını doğrula
        shell: bash
        run: |
          node scripts/eas-branding-preinstall.cjs
          npx expo prebuild --platform android --no-install --clean
          test -d android/app/src/main/res
          if ! find android/app/src/main/res -type f -name 'splashscreen_logo*' | grep -q .; then
            echo "::error title=Splash kaynağı eksik::Native Android splashscreen_logo oluşturulmadı"
            exit 1
          fi
          rm -rf android
      - name: İmzalı Android APK üret
        shell: bash
        run: |
          eas build --platform android --profile android-apk --non-interactive --clear-cache --wait --json > build-result.json
      - name: APK indir ve doğrula
        id: download
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const json=JSON.parse(fs.readFileSync('build-result.json','utf8'));
          const build=Array.isArray(json)?json[0]:(json.build||json);
          const url=build?.artifacts?.buildUrl||build?.artifacts?.applicationArchiveUrl;
          if(!url||!/^https:\/\//.test(url)||!build.id)throw Error('APK indirme URL veya build ID eksik');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/b2b-apk-url.txt',url);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/b2b-apk-build-id.txt',String(build.id));
          console.log('EAS APK build ID:',build.id);
          NODE
          curl -fSL --retry 4 --retry-all-errors --retry-delay 3 \
            --output "$RUNNER_TEMP/caliskan-b2b-android-test.apk" \
            "$(cat "$RUNNER_TEMP/b2b-apk-url.txt")"
          test -s "$RUNNER_TEMP/caliskan-b2b-android-test.apk"
          unzip -t "$RUNNER_TEMP/caliskan-b2b-android-test.apk" > /dev/null
          unzip -Z1 "$RUNNER_TEMP/caliskan-b2b-android-test.apk" | grep -Fxq 'AndroidManifest.xml'
          echo "APK_READY=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Çalışkan B2B Android APK"
            echo "- Uygulama: \u005c\u0060com.caliskangroup.rma\u005c\u0060"
            echo "- Sürüm: \u005c\u00601.3.12\u005c\u0060"
            echo "- EAS build ID: \u005c\u0060$(cat "$RUNNER_TEMP/b2b-apk-build-id.txt")\u005c\u0060"
            echo "- APK: \u005c\u0060caliskan-b2b-android-test.apk\u005c\u0060"
            echo "- İndirme: Actions → Artifacts → Caliskan-B2B-Android-APK"
            echo "- Bu paket yalnızca Android telefon testine yöneliktir; Google Play yüklemesi için AAB gerekir."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: APK paketini GitHub Actions artifacts alanına yükle
        if: ${{ steps.download.outputs.APK_READY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Caliskan-B2B-Android-APK
          path: ${{ runner.temp }}/caliskan-b2b-android-test.apk
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
