name: Çalışkan iOS - TestFlight (B2B + Business)
# One-time release trigger for the user-requested 2026-10-20 TestFlight delivery.
# Restore manual-only workflow immediately after the dispatch is observed.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/testflight-all-apps.yml'
  workflow_dispatch:
    inputs:
      app:
        description: Which iOS app to send to TestFlight?
        required: true
        type: choice
        default: all
        options: [all, b2b, business]

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  b2b:
    name: Çalışkan B2B - iOS build and TestFlight
    if: github.event_name == 'push' || inputs.app == 'all' || inputs.app == 'b2b'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Check Expo credentials
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=Missing EXPO_TOKEN::Create an Expo access token in expo.dev Settings > Access Tokens, then save it as EXPO_TOKEN in GitHub repository Settings > Secrets and variables > Actions. Do not paste token into repository or chat."
            {
              echo "### Release blocked: EXPO_TOKEN is missing"
              echo "1. Generate an Expo personal access token for an account authorized on **both** EAS projects."
              echo "2. Save it as \`EXPO_TOKEN\` under GitHub → Settings → Secrets and variables → Actions."
              echo "3. Rerun this workflow with \`app=all\`."
              echo "No iOS build was started and no submission to TestFlight occurred."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: npm ci
      - name: Verify main revision and prepare release assets
        run: |
          node scripts/create-scan-beep.cjs
          node scripts/prepare-native-release.cjs
          node scripts/sync-mobile-branding.cjs b2b
      - name: Verify Expo account can access this app
        run: eas whoami
      - name: Build signed iOS application
        run: eas build --platform ios --profile testflight --non-interactive
      - name: Submit iOS build to TestFlight and wait for result
        run: eas submit --platform ios --profile testflight --latest --non-interactive --wait

  business:
    name: Çalışkan Business - iOS build and TestFlight
    if: github.event_name == 'push' || inputs.app == 'all' || inputs.app == 'business'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: business-mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Check Expo credentials
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=Missing EXPO_TOKEN::Create an Expo access token in expo.dev Settings > Access Tokens, then save it as EXPO_TOKEN in GitHub repository Settings > Secrets and variables > Actions. Do not paste token into repository or chat."
            {
              echo "### Release blocked: EXPO_TOKEN is missing"
              echo "1. Generate an Expo personal access token for an account authorized on **both** EAS projects."
              echo "2. Save it as \`EXPO_TOKEN\` under GitHub → Settings → Secrets and variables → Actions."
              echo "3. Rerun this workflow with \`app=all\`."
              echo "No iOS build was started and no submission to TestFlight occurred."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: business-mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: npm ci
      - name: Prepare brand assets
        run: npm run sync:branding
      - name: Verify Expo account can access this app
        run: eas whoami
      - name: Build signed iOS application
        run: eas build --platform ios --profile testflight --non-interactive
      - name: Submit iOS build to TestFlight and wait for result
        run: eas submit --platform ios --profile testflight --latest --non-interactive --wait
