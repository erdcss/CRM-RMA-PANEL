name: B2B iOS 1.3.0 - EAS native build failure diagnosis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/release-requests/b2b-ios-1-3-0-diagnostics.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci --ignore-scripts
      - name: Report failed native build log
        run: |
          eas build:view 7845f517-9637-4136-a0c2-796a7f14a5e2 --json > "$RUNNER_TEMP/b2b-failed-build.json"
          node - <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/b2b-failed-build.json','utf8'));
            const build=raw.build||raw;
            console.log('Build:',build.id,build.status,'error:',JSON.stringify(build.error||null));
            const files=(build.logFiles||[]).slice(-6);
            for(const [index,url] of files.entries()){
              try{
                const response=await fetch(url);
                if(!response.ok){console.log('Log',index,'HTTP',response.status);continue;}
                const log=await response.text();
                const lines=log.split('\n');
                const hits=lines.map((line,i)=>/error|failed|exception|npm err|pod install|invalid|missing|cannot find|build failed/i.test(line)?i:-1).filter(i=>i>=0);
                console.log('--- Native log',index,'tail ---');
                console.log(lines.slice(-60).map(s=>s.slice(0,300)).join('\n'));
                for(const ix of hits.slice(-12))console.log(lines.slice(Math.max(0,ix-2),ix+3).map(s=>s.slice(0,300)).join('\n'));
              }catch(err){console.log('Log fetch:',String(err));}
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
