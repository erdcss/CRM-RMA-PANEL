name: B2B Notifications and Invoices Build
on:
  push:
    paths:
      - 'server/b2b-notification-center.ts'
      - 'server/b2b-location-admin.ts'
      - 'client/src/components/b2b-location-notification-settings.tsx'
      - 'client/src/pages/ayarlar.tsx'
      - 'server/b2b-scheduled-notifications.ts'
      - 'server/b2b-scheduled-time.ts'
      - 'server/b2b-scheduled-time.test.ts'
      - 'server/b2b-push-enrollment.ts'
      - 'server/b2b-invoice-documents.ts'
      - 'server/push-notifications.ts'
      - 'server/routes.ts'
      - 'client/src/pages/admin-notifications.tsx'
      - 'client/src/pages/admin-orders.tsx'
      - 'client/src/pages/admin-returns.tsx'
      - 'client/src/pages/admin-reels.tsx'
      - 'client/src/pages/admin-product-ai-import.tsx'
      - 'server/admin-platform.ts'
      - 'client/src/App.tsx'
      - 'client/src/pages/marketplace-seller.tsx'
      - 'client/src/pages/marketplace-public.tsx'
      - 'client/src/pages/b2b-storefront.tsx'
      - 'client/src/pages/b2b-product.tsx'
      - 'client/src/pages/marketplace-cart.tsx'
      - 'client/src/components/b2b-product-card.tsx'
      - 'client/src/lib/b2b-marketplace-products.ts'
      - 'server/marketplace.ts'
      - 'server/marketplace-media.ts'
      - 'server/marketplace-cart.ts'
      - 'server/supplier-privacy.ts'
      - 'server/supplier-order-pdf.ts'
      - 'server/supplier-privacy.test.ts'
      - 'server/marketplace-video-upload.ts'
      - 'server/index.ts'
      - 'client/src/pages/b2b-orders.tsx'
      - 'client/src/pages/b2b-payment.tsx'
      - 'client/src/lib/b2b-cart.ts'
      - 'client/src/components/app-sidebar.tsx'
      - '.github/workflows/b2b-notifications-invoices-build.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Supplier customer-data privacy regression tests
        run: npx tsx --test server/supplier-privacy.test.ts
      - name: Scheduled notification time and timezone regression
        run: npx tsx --test server/b2b-scheduled-time.test.ts
      - name: TypeScript check
        run: npm run check
      - name: Admin and API build
        run: npm run build
