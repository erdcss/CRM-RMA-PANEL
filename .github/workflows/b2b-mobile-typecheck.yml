name: B2B Mobile Typecheck
on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/b2b-mobile-typecheck.yml'
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node --test scripts/b2b-share-crash.test.cjs
      - run: node --test scripts/tiktok-commerce.test.cjs
      - run: node --test scripts/campaign-hero-layout.test.cjs
      - run: npm run typecheck
