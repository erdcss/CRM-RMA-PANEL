name: Çalışkan Dükkan Bağımsız Windows Kurulumu
on:
  push:
    branches: [main]
    paths:
      - "caliskan-dukkan-offline/**"
      - ".github/workflows/dukkan-offline-windows.yml"
  pull_request:
    paths:
      - "caliskan-dukkan-offline/**"
      - ".github/workflows/dukkan-offline-windows.yml"
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: caliskan-dukkan-offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund
      - name: JavaScript syntax kontrolü
        run: node --check backend.cjs && node --check app.js && node --check main.cjs && node --check preload.cjs
        shell: bash
      - name: Yerel muhasebe bütünlük testleri
        run: npm test
      - name: Windows kurulum dosyası oluştur
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Kurulum paketinde arayüz dosyalarını doğrula
        run: npm run verify:package
      - uses: actions/upload-artifact@v4
        with:
          name: Caliskan-Dukkan-Bagimsiz-Windows
          path: caliskan-dukkan-offline/dist/*.exe
          if-no-files-found: error
          retention-days: 30
