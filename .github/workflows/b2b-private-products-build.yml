name: B2B Private Company Products Security
on:
  push:
    paths:
      - 'server/b2b-private-products.ts'
      - 'server/b2b-private-products.test.ts'
      - 'shared/b2b-private-product-policy.ts'
      - 'server/admin-platform.ts'
      - 'server/routes.ts'
      - 'server/b2b-link-preview.ts'
      - 'server/meta-catalog.ts'
      - 'server/b2b-stock-alerts.ts'
      - 'server/b2b-timed-campaigns.ts'
      - 'server/b2b-abandoned-carts.ts'
      - 'server/dukkan.ts'
      - 'server/dukkan-b2b-sync.ts'
      - 'client/src/pages/admin-products.tsx'
      - 'client/src/pages/admin-product-add.tsx'
      - 'client/src/components/admin-private-product-customer-select.tsx'
      - 'client/src/lib/b2b-cart.ts'
      - 'mobile/lib/b2b-order-list.ts'
      - '.github/workflows/b2b-private-products-build.yml'
  pull_request:
    paths:
      - 'server/b2b-private-products.ts'
      - 'server/routes.ts'
      - 'server/admin-platform.ts'
      - 'client/src/pages/admin-products.tsx'
      - 'client/src/pages/admin-product-add.tsx'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Private product ownership rule tests
        run: npx tsx --test server/b2b-private-products.test.ts
      - name: TypeScript
        run: npm run check
      - name: Build admin and API
        run: npm run build
      - name: Mobile TypeScript
        run: cd mobile && npm ci --ignore-scripts && npx tsc --noEmit
