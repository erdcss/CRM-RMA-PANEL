name: Cari PDF Import Regression

on:
  pull_request:
    paths:
      - 'server/dukkan-cari-*'
      - 'client/src/components/dukkan-cari-statement-import.tsx'
      - '.github/workflows/cari-import-tests.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Cari PDF importer regression tests
        run: npx tsx --test server/dukkan-cari-statement-parser.test.ts server/dukkan-cari-statement-pdf.integration.test.ts server/dukkan-cari-import.integration.test.ts
      - name: TypeScript check
        run: npm run check
