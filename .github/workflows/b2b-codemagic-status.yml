name: Çalışkan B2B TestFlight - Codemagic Durum Takibi

on:
  push:
    branches: [main]
    paths:
      - '.github/release-requests/b2b-codemagic-status.txt'
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Codemagic Build ID'
        required: true
        type: string

permissions:
  contents: read

jobs:
  status:
    name: Codemagic TestFlight gerçek derleme ve yükleme durumunu izle
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
      REQUESTED_BUILD_ID: ${{ inputs.build_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Check build state via authenticated Codemagic API
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const marker='.github/release-requests/b2b-codemagic-status.txt';
          const raw = process.env.REQUESTED_BUILD_ID ||
            fs.readFileSync(marker,'utf8').match(/^Build ID: ([a-f0-9]{24})$/m)?.[1];
          if(!raw || !/^[a-f0-9]{24}$/.test(raw))throw Error('Valid Codemagic Build ID missing');
          const token=process.env.CODEMAGIC_API_TOKEN;
          if(!token)throw Error('CODEMAGIC_API_TOKEN missing from GitHub Repository Secrets');
          const target='https://codemagic.io/app/6afedc30f47c90e3676e0a20/build/'+raw;
          const end=new Set(['finished','failed','canceled','timeout','skipped']);
          let last='',build=null,status='unknown';
          console.log('Tracking B2B TestFlight build:',raw);
          for(let i=0;i<50;i++){
            const res=await fetch('https://api.codemagic.io/builds/'+raw,{
              headers:{'x-auth-token':token,'Content-Type':'application/json'},
              signal:AbortSignal.timeout(25000)
            });
            if(!res.ok){
              if(res.status===404 && i<3){
                console.log('Codemagic build still registering (404), retrying.');
                await new Promise(resolve=>setTimeout(resolve,20000));
                continue;
              }
              throw Error('Codemagic status API returned HTTP '+res.status);
            }
            const json=await res.json();
            build=json.build || json.data || json;
            status=String(build.status||'unknown').toLowerCase();
            if(status!==last){console.log('Codemagic build status:',status);last=status}
            if(end.has(status))break;
            if(i<49)await new Promise(resolve=>setTimeout(resolve,60000));
          }
          const actions=Array.isArray(build?.buildActions)?build.buildActions.map(x=>({
            type:x.type,status:x.status
          })):[];
          const summary=[
            '### Çalışkan B2B TestFlight derleme sonucu',
            '',
            '- **Uygulama:** CRM-RMA-PANEL',
            '- **Hedef:** TestFlight, com.caliskangroup.rma, sürüm '+JSON.parse(fs.readFileSync('mobile/app.json','utf8')).expo.version,
            '- **Build ID:** '+raw,
            '- **Codemagic:** ['+status+']('+target+')',
            '- **Alt aşamalar:** '+JSON.stringify(actions),
            '',
            'Önemli: Codemagic finished durumu Apple TestFlight işlemeye başlaması ile aynı değildir.',
            ''
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
          console.log(summary);
          if(status==='failed'||status==='canceled'||status==='timeout'||status==='skipped')process.exitCode=1;
          if(!end.has(status))console.warn('Status monitoring ended before a terminal result; inspect Codemagic build link.');
          NODE
