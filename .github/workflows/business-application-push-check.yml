name: Business application push checks
on:
  push:
    paths:
      - 'server/business-application-alerts.ts'
      - 'server/business-application-alerts.test.ts'
      - 'server/routes.ts'
      - 'server/marketplace.ts'
      - 'business-mobile/App.tsx'
      - 'business-mobile/lib/push.ts'
      - 'business-mobile/types.ts'
      - 'business-mobile/screens/MarketplaceScreen.tsx'
      - '.github/workflows/business-application-push-check.yml'
  pull_request:
    paths:
      - 'server/business-application-alerts.ts'
      - 'server/business-application-alerts.test.ts'
      - 'server/routes.ts'
      - 'server/marketplace.ts'
      - 'business-mobile/App.tsx'
      - 'business-mobile/lib/push.ts'
      - 'business-mobile/types.ts'
      - 'business-mobile/screens/MarketplaceScreen.tsx'
      - '.github/workflows/business-application-push-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Server and Business app push validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Test application event payloads
        run: npx tsx --test server/business-application-alerts.test.ts
      - name: Verify TypeScript
        run: npm run check
      - name: Install Business Mobile dependencies
        working-directory: business-mobile
        run: npm ci --ignore-scripts
      - name: Verify Business Mobile TypeScript
        working-directory: business-mobile
        run: npx tsc --noEmit --project tsconfig.json
