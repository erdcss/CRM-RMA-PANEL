name: Dukkan Lorenzo Catalog and Thumbnail Checks
on:
  pull_request:
    paths:
      - 'server/dukkan-lorenzo-import.ts'
      - 'server/dukkan-lorenzo-import.test.ts'
      - 'server/dukkan-thumbnail-images.ts'
      - 'server/dukkan.ts'
      - 'client/src/components/dukkan-product-thumbnail-drop.tsx'
      - 'client/src/pages/dukkan.tsx'
      - '.github/workflows/dukkan-lorenzo-thumbnails-check.yml'
  push:
    branches: [main]
    paths:
      - 'server/dukkan-lorenzo-import.ts'
      - 'server/dukkan-lorenzo-import.test.ts'
      - 'server/dukkan-thumbnail-images.ts'
      - 'server/dukkan.ts'
      - 'client/src/components/dukkan-product-thumbnail-drop.tsx'
      - 'client/src/pages/dukkan.tsx'
      - '.github/workflows/dukkan-lorenzo-thumbnails-check.yml'
permissions:
  contents: read
jobs:
  check:
    name: Lorenzo Catalog / Thumbnail Tests and Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsx --test server/dukkan-lorenzo-import.test.ts
      - run: npm run check
      - run: npm run build
