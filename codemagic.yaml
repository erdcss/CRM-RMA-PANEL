          npx tsc --noEmit --project tsconfig.json
      - name: Prepare correct Business application identity and branding
        script: |
          set -e
          cd business-mobile
          npm run sync:branding
          node scripts/codemagic-build-version.cjs android
      - name: Generate Android native project
        script: |
          set -e
          cd business-mobile
          npx expo prebuild --platform android --clean --no-install
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          node scripts/codemagic-android-signing.cjs
      - name: Build signed Google Play AAB
        script: |
