    environment:
      android_signing:
        - caliskan_business_android_release
      vars:
        EXPO_PUBLIC_API_URL: "https://admin.ecalisgan.com"
        CI: "1"
      node: 22
      java: 17
    scripts:
      - name: Verify explicit chat release request
        script: |
          set -eu
          if [ "${CM_TRIGGER_SOURCE:-}" = "webhook" ]; then
            git show --format= --name-only HEAD | grep -Fxq '.github/release-requests/business-codemagic-apk.txt' || {
              echo "Push-triggered release requires marker in this commit: .github/release-requests/business-codemagic-apk.txt";
              exit 1;
            }
          fi
      - name: Install and typecheck Business application
        script: |
          set -e
          cd business-mobile
          npm ci
          npx tsc --noEmit --project tsconfig.json
      - name: Prepare correct Business application identity and branding
        script: |
          set -e
          cd business-mobile
          npm run sync:branding
          node scripts/codemagic-build-version.cjs android
      - name: Generate Android native project
        script: |
          set -e
          cd business-mobile
          npx expo prebuild --platform android --clean --no-install
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          node scripts/codemagic-android-signing.cjs
      - name: Build standalone signed APK
        script: |
          set -e
          cd business-mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
    artifacts:
      - business-mobile/android/app/build/outputs/apk/release/*.apk
      - business-mobile/android/app/build/outputs/mapping/release/mapping.txt

