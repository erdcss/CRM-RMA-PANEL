          scheme="$(xcodebuild -list -json -workspace "$workspace" | python3 -c 'import json,sys; print(next((s for s in json.load(sys.stdin)["workspace"]["schemes"] if not s.startswith("Pods-")), ""))')"
          test -n "$scheme"
          xcode-project build-ipa --workspace "$workspace" --scheme "$scheme"
          python3 - <<'PY'
          import json, plistlib
          from pathlib import Path
          from zipfile import ZipFile
          files=list(Path("build/ios/ipa").glob("*.ipa"))
          if len(files)!=1: raise SystemExit("Expected one signed Dukkan IPA")
          expected=json.loads(Path("app.json").read_text())["expo"]
          with ZipFile(files[0]) as ipa:
              names=[n for n in ipa.namelist() if n.startswith("Payload/") and n.count("/")==2 and n.endswith(".app/Info.plist")]
              if len(names)!=1: raise SystemExit("Expected one main app Info.plist")
              info=plistlib.loads(ipa.read(names[0]))
              if not any(n.startswith("Payload/") and n.endswith(".app/Assets.car") for n in ipa.namelist()): raise SystemExit("Missing compiled asset catalog")
          if (info.get("CFBundleIdentifier"),str(info.get("CFBundleVersion")),info.get("CFBundleShortVersionString")) != ("com.caliskan.dukkan",expected["ios"]["buildNumber"],expected["version"]):
              raise SystemExit("Signed Dukkan IPA identity/version mismatch")
          print("Verified Dukkan IPA", info["CFBundleShortVersionString"], info["CFBundleVersion"])
          PY
    artifacts:
