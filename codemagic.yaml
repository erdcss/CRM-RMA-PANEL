          ./gradlew bundleRelease --no-daemon
    artifacts:
      - business-mobile/android/app/build/outputs/bundle/release/*.aab
      - business-mobile/android/app/build/outputs/mapping/release/mapping.txt

  # Dukkan: Expo native prebuild on Codemagic, isolated TestFlight only.
  caliskan-dukkan-ios-testflight:
    name: Caliskan Dukkan - iOS TestFlight (Codemagic)
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events: []
    integrations:
      app_store_connect: Codemagic Caliskan B2B
    environment:
      ios_signing:
        certificates:
          - caliskan_b2b_appstore_distribution
        provisioning_profiles:
          - caliskan_dukkan_appstore_2027
      vars:
        EXPO_PUBLIC_DUKKAN_URL: "https://admin.ecalisgan.com/dukkan"
        APP_STORE_APPLE_ID: "6826848065"
        CI: "1"
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--use-old-altool"
