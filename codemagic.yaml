# B2B iOS backup CI: Expo SDK, but NOT Expo EAS Build.
# Chat-triggered build via GitHub marker push; Codemagic webhook required.
# Manual UI builds remain available. Use App Store distribution signing certificate + profile
# for com.caliskangroup.rma in Codemagic Code Signing Identities.
workflows:
  caliskan-b2b-ios:
    name: Caliskan B2B - iOS App Store release (no Expo EAS)
    instance_type: mac_mini_m2
    max_build_duration: 120
    # Only a dedicated chat command marker triggers this costly iOS build.
    # Routine code commits, Android requests, and docs changes are excluded.
    # First config change may be detected as a changeset by Codemagic.
    # TestFlight and public App Store builds require an explicit API or UI
    # action; ordinary GitHub pushes and status markers MUST NOT start builds.
    # Codemagic documents events: [] as manual-only.
    triggering:
      events: []
    when:
      changeset:
        includes:
          - '.github/release-requests/b2b-ios-testflight.txt'
    integrations:
      app_store_connect: Codemagic Caliskan B2B
    environment:
      ios_signing:
        certificates:
          - caliskan_b2b_appstore_distribution
        provisioning_profiles:
          - caliskan_b2b_appstore_2026
      vars:
        EXPO_PUBLIC_API_URL: "https://b2b.ecalisgan.com"
        EXPO_PUBLIC_B2B_AD_TRACKING: "0"
        REQUIRE_B2B_CUSTOM_NOTIFICATION_SOUND: "1"
        EXPO_SKIP_NIIMBOT: "1"
        CI: "1"
        APP_STORE_APPLE_ID: "6802286663"
      node: 22
      xcode: 26.4
      cocoapods: default
    scripts:
      - name: Verify explicit chat release request
        script: |
          set -eu
          if [ "${CM_TRIGGER_SOURCE:-}" = "webhook" ]; then
            git show --format= --name-only HEAD | grep -Fxq '.github/release-requests/b2b-ios-testflight.txt' || {
              echo "Push-triggered release requires marker in this commit: .github/release-requests/b2b-ios-testflight.txt";
              exit 1;
            }
          fi
      - name: Install packages
        script: |
          set -e
          cd mobile
          npm ci
      - name: Sync B2B branding and check sources
        script: |
          set -e
          cd mobile
          node scripts/create-scan-beep.cjs
          node scripts/prepare-native-release.cjs
          npm run sync:branding
          # Exclude private NIIMBOT SDK libraries and set unique CFBundleVersion.
          node scripts/codemagic-ios-prebuild.cjs
          npm run typecheck
      - name: Generate iOS native Xcode project
        script: |
          set -e
          cd mobile
          npx expo prebuild --platform ios --no-install --clean
          cd ios
          pod install
      - name: Apply Apple App Store distribution signing
        script: |
          set -e
          cd mobile
          xcode-project use-profiles
      - name: Build signed IPA for App Store Connect
        script: |
          set -e
          cd mobile
          workspace="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' | head -n 1)"
          if [ -z "$workspace" ]; then echo "Xcode workspace not generated"; exit 1; fi
          scheme="$(xcodebuild -list -json -workspace "$workspace" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((s for s in d["workspace"]["schemes"] if not s.startswith("Pods-")), ""))')"
          if [ -z "$scheme" ]; then echo "Xcode scheme missing"; exit 1; fi
          xcode-project build-ipa --workspace "$workspace" --scheme "$scheme"
    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # Public App Store release build, not a TestFlight-internal-only export.
    # Codemagic uploads to the existing B2B App Store Connect app,
    # requests App Review and releases automatically AFTER Apple's approval.
    # An incomplete App Store listing/review metadata can block submission.
    # Do not cancel another submission automatically.
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true
        release_type: AFTER_APPROVAL
        phased_release: false

  # Dedicated internal beta release, isolated from the public App Store workflow.
  caliskan-b2b-testflight:
    name: Caliskan B2B - iOS TestFlight only (no public App Store)
    instance_type: mac_mini_m2
    max_build_duration: 120
    # Only a dedicated chat command marker triggers this costly iOS build.
    # Routine code commits, Android requests, and docs changes are excluded.
    # First config change may be detected as a changeset by Codemagic.
    # TestFlight and public App Store builds require an explicit API or UI
    # action; ordinary GitHub pushes and status markers MUST NOT start builds.
    # Codemagic documents events: [] as manual-only.
    triggering:
      events: []
    # Intentionally NO workflow-level when.changeset:
    # Codemagic applies it even to manual/API builds and marks the job Skipped
    # when the watched marker is absent from the requested main commit.
    # triggering.events: [] prevents automatic GitHub webhook builds.
    # Only the explicitly authorized API/UI action starts this paid iOS job.
    integrations:
      app_store_connect: Codemagic Caliskan B2B
    environment:
      ios_signing:
        certificates:
          - caliskan_b2b_appstore_distribution
        provisioning_profiles:
          - caliskan_b2b_appstore_2026
      vars:
        EXPO_PUBLIC_API_URL: "https://b2b.ecalisgan.com"
        EXPO_PUBLIC_B2B_AD_TRACKING: "0"
        REQUIRE_B2B_CUSTOM_NOTIFICATION_SOUND: "1"
        EXPO_SKIP_NIIMBOT: "1"
        CI: "1"
        APP_STORE_APPLE_ID: "6802286663"
        # Apple 90062/90186: 1.3.13 is an approved, closed TestFlight train.
        # Raise this baseline whenever a newer App Store version is approved.
        B2B_LAST_APPROVED_IOS_VERSION: "1.3.13"
        # Codemagic Xcode 26 altool App ID resolution compatibility workaround.
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--use-old-altool"
      node: 22
      xcode: 26.4
      cocoapods: default
    scripts:
      - name: Verify explicit chat release request
        script: |
          set -eu
          if [ "${CM_TRIGGER_SOURCE:-}" = "webhook" ]; then
            git show --format= --name-only HEAD | grep -Fxq '.github/release-requests/b2b-ios-testflight-only.txt' || {
              echo "Push-triggered release requires marker in this commit: .github/release-requests/b2b-ios-testflight-only.txt";
              exit 1;
            }
          fi
      - name: Install packages
        script: |
          set -e
          cd mobile
          npm ci
      - name: Sync B2B branding and check sources
        script: |
          set -e
          cd mobile
          node scripts/create-scan-beep.cjs
          node scripts/prepare-native-release.cjs
          npm run sync:branding
          # Fail fast when the Apple integration cannot read the intended app.
          # This also prevents both independent Codemagic workflows from using
          # the same CFBundleVersion when their run counters overlap.
          LATEST_APPLE_BUILD="$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" --all-versions)"
          case "$LATEST_APPLE_BUILD" in
            ""|*[!0-9]*)
              echo "App Store Connect did not return a valid latest build number."
              echo "Check Codemagic Apple integration API key, app access and App Store Connect app ID."
              exit 1
              ;;
          esac
          export B2B_APPSTORE_LATEST_BUILD_NUMBER="$LATEST_APPLE_BUILD"
          echo "App Store Connect latest build number: $LATEST_APPLE_BUILD"
          # Exclude private NIIMBOT SDK libraries and stamp an Apple-safe higher build number.
          node scripts/codemagic-ios-prebuild.cjs
          npm run typecheck
          node --test scripts/home-managed-modules.test.cjs
          node --test scripts/b2b-dedicated-header-branding.test.cjs
          node --test scripts/home-categories-banner-layout.test.cjs
      - name: Generate iOS native Xcode project
        script: |
          set -e
          cd mobile
          npx expo prebuild --platform ios --no-install --clean
          cd ios
          pod install
      - name: Apply Apple App Store distribution signing
        script: |
          set -e
          cd mobile
          xcode-project use-profiles
      - name: Build signed IPA for App Store Connect
        script: |
          set -e
          cd mobile
          workspace="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' | head -n 1)"
          if [ -z "$workspace" ]; then echo "Xcode workspace not generated"; exit 1; fi
          scheme="$(xcodebuild -list -json -workspace "$workspace" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((s for s in d["workspace"]["schemes"] if not s.startswith("Pods-")), ""))')"
          if [ -z "$scheme" ]; then echo "Xcode scheme missing"; exit 1; fi
          xcode-project build-ipa --workspace "$workspace" --scheme "$scheme"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import plistlib
          files=list(Path("build/ios/ipa").glob("*.ipa"))
          if len(files)!=1:
              raise SystemExit(f"Expected one signed IPA; found {len(files)}")
          with ZipFile(files[0]) as ipa:
              matches=[n for n in ipa.namelist() if n.startswith("Payload/") and n.count("/") == 2 and n.endswith(".app/Info.plist")]
              if not matches:
                  matches=[n for n in ipa.namelist() if n.startswith("Payload/") and ".app/Info.plist" in n and not "/PlugIns/" in n]
              if not matches:
                  raise SystemExit("Signed IPA does not contain main app Info.plist")
              info=plistlib.loads(ipa.read(matches[0]))
          bundle=info.get("CFBundleIdentifier","")
          version=info.get("CFBundleShortVersionString","")
          build=info.get("CFBundleVersion","")
          if bundle!="com.caliskangroup.rma" or not str(build).isdigit():
              raise SystemExit(f"Unexpected IPA identity: bundle={bundle} version={version} build={build}")
          icon=info.get("CFBundleIconName") or info.get("CFBundleIcons",{}).get("CFBundlePrimaryIcon",{}).get("CFBundleIconName")
          if not icon:
              raise SystemExit("Apple icon metadata missing: CFBundleIconName / CFBundleIcons.CFBundlePrimaryIcon")
          if not any(n.startswith("Payload/") and n.endswith(".app/Assets.car") for n in ipa.namelist()):
              raise SystemExit("Compiled iOS asset catalog (Assets.car) missing from IPA")
          orientations=info.get("UISupportedInterfaceOrientations",[])
          if not isinstance(orientations,list) or "UIInterfaceOrientationPortrait" not in orientations:
              raise SystemExit("Missing supported iOS portrait interface orientation")
          print(f"Verified signed IPA: bundle={bundle}, version={version}, build={build}, icon={icon}, orientations={orientations}")
          PY
    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # Internal TestFlight distribution only. Never initiate public App Store review.
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # Business workflows share the existing Codemagic app and GitHub webhook.
  # Only dedicated release-marker commits trigger paid native builds.
  # They do NOT use Expo EAS Build and do NOT publish to the public App Store.
  caliskan-business-ios-testflight:
    name: Caliskan Business - iOS TestFlight (Codemagic)
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events: []
    integrations:
      app_store_connect: Codemagic Caliskan B2B
    environment:
      ios_signing:
        certificates:
          - caliskan_b2b_appstore_distribution
        provisioning_profiles:
          - caliskan_business_appstore_2027
      vars:
        EXPO_PUBLIC_API_URL: "https://admin.ecalisgan.com"
        APP_STORE_APPLE_ID: "6818161236"
        CI: "1"
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--use-old-altool"
      node: 22
      xcode: 26.4
      cocoapods: default
    scripts:
      - name: Install Business packages and verify TypeScript
        script: |
          set -e
          cd business-mobile
          npm ci
          node -e 'const a=require("./app.json").expo; const e=require("./eas.json").submit.testflight.ios; if(a.ios.bundleIdentifier!=="com.caliskangroup.business" || e.ascAppId!==process.env.APP_STORE_APPLE_ID || e.appleTeamId!=="U3WGSDJCT2") throw Error("Business identity mismatch")'
          npx tsc --noEmit --project tsconfig.json
      - name: Sync current Business logo and splash from CRM
        script: |
          set -e
          cd business-mobile
          npm run sync:branding
          LATEST="$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" --all-versions)"
          export LATEST
          node <<'NODE'
          const fs=require('node:fs');
          const config=JSON.parse(fs.readFileSync('app.json','utf8'));
          if(!/^\d+$/.test(process.env.LATEST||''))throw Error('Apple latest build number could not be verified; check Business app access');
          const latest=Number(process.env.LATEST);
          if(!Number.isSafeInteger(latest)||latest<0||latest>=Number.MAX_SAFE_INTEGER)throw Error('Invalid Apple build number');
          config.expo.ios.buildNumber=String(Math.max(latest+1,Number(config.expo.ios.buildNumber)||1));
          fs.writeFileSync('app.json',JSON.stringify(config,null,2)+'\n');
          console.log('Business iOS '+config.expo.version+' build '+config.expo.ios.buildNumber);
          NODE
      - name: Generate native iOS project and install pods
        script: |
          set -e
          cd business-mobile
          npx expo prebuild --platform ios --clean --no-install
          cd ios
          pod install
      - name: Sign Business bundle for TestFlight
        script: |
          set -e
          cd business-mobile
          xcode-project use-profiles
      - name: Create signed Business IPA
        script: |
          set -e
          cd business-mobile
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -type d | head -n 1)"
          test -n "$workspace" || { echo "Business Xcode workspace missing"; exit 1; }
          scheme="$(xcodebuild -list -json -workspace "$workspace" | python3 -c 'import json,sys; print(next((s for s in json.load(sys.stdin)["workspace"]["schemes"] if not s.startswith("Pods-")), ""))')"
          test -n "$scheme" || { echo "Business Xcode scheme missing"; exit 1; }
          xcode-project build-ipa --workspace "$workspace" --scheme "$scheme"
          python3 - <<'PY'
          import json, plistlib
          from pathlib import Path
          from zipfile import ZipFile
          files=list(Path("build/ios/ipa").glob("*.ipa"))
          if len(files)!=1: raise SystemExit("Expected one signed Business IPA")
          expected=json.loads(Path("app.json").read_text())["expo"]
          with ZipFile(files[0]) as ipa:
              names=[n for n in ipa.namelist() if n.startswith("Payload/") and n.count("/")==2 and n.endswith(".app/Info.plist")]
              if len(names)!=1: raise SystemExit("Expected one main app Info.plist")
              info=plistlib.loads(ipa.read(names[0]))
              if not any(n.startswith("Payload/") and n.endswith(".app/Assets.car") for n in ipa.namelist()): raise SystemExit("Missing compiled asset catalog")
          if (info.get("CFBundleIdentifier"),str(info.get("CFBundleVersion")),info.get("CFBundleShortVersionString")) != ("com.caliskangroup.business",expected["ios"]["buildNumber"],expected["version"]):
              raise SystemExit("Signed Business IPA identity/version mismatch")
          print("Verified Business IPA",info["CFBundleShortVersionString"],info["CFBundleVersion"])
          PY
    artifacts:
      - business-mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  caliskan-business-android-apk:
    name: Caliskan Business - Android APK (Codemagic)
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
